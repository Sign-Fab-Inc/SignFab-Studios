name: Deploy employee portal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
concurrency:
  group: signfab-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure SignFab tenant
        env:
          SIGNFAB_TENANT_ID: ${{ vars.SIGNFAB_TENANT_ID }}
        run: node scripts/configure.mjs
      - name: Validate protected routes and studio files
        run: node scripts/check.mjs --production
      - name: Deploy protected site
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: ''
          output_location: ''
          skip_app_build: true
